<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temporary Email</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#fff1f7;
color:#444;
}

.container{
width:min(760px,94%);
margin:35px auto;
}

.card{
background:#fff;
border-radius:24px;
padding:25px;
box-shadow:0 10px 35px rgba(220,130,170,.15);
}

.header{
text-align:center;
margin-bottom:22px;
}

.header h1{
margin:5px 0;
font-size:28px;
color:#d86c9d;
}

.header p{
margin:0;
font-size:14px;
color:#999;
}

/* CUTE GIRL */

.chibi{
width:100px;
height:100px;
margin:0 auto 8px;
position:relative;
}

.face{
position:absolute;
width:65px;
height:65px;
background:#ffd9c9;
border-radius:50%;
left:18px;
top:25px;
z-index:2;
}

.hair{
position:absolute;
width:82px;
height:80px;
background:#3d3540;
border-radius:48% 48% 42% 42%;
left:9px;
top:13px;
z-index:1;
}

.fringe{
position:absolute;
width:72px;
height:35px;
background:#3d3540;
left:14px;
top:15px;
z-index:3;
border-radius:0 0 50% 50%;
}

.eye{
position:absolute;
width:6px;
height:9px;
background:#4b3b43;
border-radius:50%;
top:52px;
z-index:4;
}

.eye.left{
left:34px;
}

.eye.right{
left:61px;
}

.blush{
position:absolute;
width:13px;
height:7px;
background:#f3a6b8;
border-radius:50%;
top:64px;
z-index:4;
}

.blush.left{
left:27px;
}

.blush.right{
left:64px;
}

.mouth{
position:absolute;
width:9px;
height:5px;
border-bottom:2px solid #c4778d;
border-radius:50%;
left:48px;
top:69px;
z-index:4;
}

.bow-left,
.bow-right{
position:absolute;
width:25px;
height:22px;
background:#ee91b6;
top:5px;
z-index:5;
}

.bow-left{
left:14px;
border-radius:80% 20% 20% 80%;
transform:rotate(-18deg);
}

.bow-right{
left:61px;
border-radius:20% 80% 80% 20%;
transform:rotate(18deg);
}

.bow-center{
position:absolute;
width:10px;
height:10px;
background:#d96b9b;
border-radius:50%;
left:50px;
top:11px;
z-index:6;
}

.email-box{
display:flex;
gap:10px;
margin-top:18px;
}

.email-box input{
flex:1;
border:1px solid #f0c7d9;
background:#fff8fb;
border-radius:13px;
padding:14px;
font-size:14px;
outline:none;
color:#555;
}

button{
border:0;
border-radius:12px;
padding:12px 16px;
cursor:pointer;
font-size:14px;
font-weight:600;
}

.copy{
background:#e990b6;
color:white;
}

.new{
background:#f8d6e5;
color:#9c5275;
}

.refresh{
background:#f3edf0;
color:#666;
}

.buttons{
display:flex;
gap:8px;
margin-top:10px;
}

.status{
text-align:center;
font-size:13px;
color:#999;
margin:14px 0;
}

.tabs{
display:flex;
gap:8px;
margin-top:20px;
border-bottom:1px solid #f2dce6;
padding-bottom:8px;
}

.tab{
padding:10px 15px;
cursor:pointer;
font-size:14px;
color:#999;
border-radius:10px;
}

.tab.active{
background:#f9d9e7;
color:#b85c87;
font-weight:bold;
}

.section-head{
display:flex;
justify-content:space-between;
align-items:center;
margin:18px 0 10px;
}

.section-head h2{
font-size:17px;
margin:0;
color:#555;
}

.count{
font-size:12px;
color:#aaa;
}

.message{
border:1px solid #f1dbe5;
border-radius:15px;
padding:15px;
margin-bottom:10px;
cursor:pointer;
background:#fff;
transition:.15s;
}

.message:hover{
background:#fff8fb;
}

.subject{
font-weight:bold;
color:#555;
margin-bottom:7px;
}

.meta{
font-size:12px;
color:#999;
margin-bottom:8px;
}

.preview{
font-size:13px;
color:#777;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.empty{
text-align:center;
padding:35px 10px;
color:#aaa;
font-size:14px;
}

.footer{
text-align:center;
font-size:12px;
color:#aaa;
margin-top:20px;
}

.footer strong{
color:#d86c9d;
}

/* MODAL */

.modal{
position:fixed;
inset:0;
background:rgba(50,30,40,.45);
display:none;
align-items:center;
justify-content:center;
padding:15px;
z-index:100;
}

.modal-box{
background:white;
width:min(700px,100%);
max-height:90vh;
border-radius:20px;
overflow:hidden;
box-shadow:0 15px 50px rgba(0,0,0,.2);
}

.modal-head{
padding:18px 20px;
border-bottom:1px solid #f0dfe6;
}

.modal-head h3{
margin:0 0 7px;
font-size:17px;
color:#555;
}

.modal-meta{
font-size:12px;
color:#999;
}

.modal-body{
padding:0;
height:60vh;
overflow:auto;
background:#fff;
}

.email-frame{
display:block;
width:100%;
height:100%;
min-height:450px;
border:0;
background:white;
}

.text-body{
padding:20px;
white-space:pre-wrap;
word-break:break-word;
font-size:14px;
line-height:1.6;
}

.modal-close{
width:100%;
border-radius:0;
background:#f9d9e7;
color:#a55376;
padding:14px;
}

/* MOBILE */

@media(max-width:600px){
.card{
padding:18px;
}

.email-box{
flex-direction:column;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
}

.refresh{
grid-column:1/-1;
}

.modal-body{
height:65vh;
}
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="header">

<div class="chibi">
<div class="hair"></div>
<div class="fringe"></div>

<div class="face">
<div class="eye left"></div>
<div class="eye right"></div>

<div class="blush left"></div>
<div class="blush right"></div>

<div class="mouth"></div>
</div>

<div class="bow-left"></div>
<div class="bow-right"></div>
<div class="bow-center"></div>
</div>

<h1>Temporary Email</h1>
<p>Simple, private and temporary email.</p>

</div>

<div class="email-box">

<input
id="email"
type="text"
readonly
placeholder="Creating email..."
>

<button class="copy" onclick="copyEmail()">
Copy
</button>

</div>

<div class="buttons">

<button class="new" onclick="newEmail()">
New Email
</button>

<button class="refresh" onclick="loadInbox()">
Refresh
</button>

</div>

<div id="status" class="status">
Checking inbox...
</div>

<div class="tabs">

<div
class="tab active"
onclick="changeTab('inbox',this)">
Inbox
</div>

<div
class="tab"
onclick="changeTab('new',this)">
New
</div>

<div
class="tab"
onclick="changeTab('spam',this)">
Spam
</div>

</div>

<div class="section-head">

<h2 id="sectionTitle">
Inbox
</h2>

<span id="count" class="count">
0
</span>

</div>

<div id="inbox">
<div class="empty">
No emails yet.
</div>
</div>

<div class="footer">
Dibuat oleh <strong>@devitads</strong>
</div>

</div>

</div>


<!-- EMAIL MODAL -->

<div id="modal" class="modal">

<div class="modal-box">

<div class="modal-head">

<h3 id="modalSubject">
Email
</h3>

<div id="modalMeta" class="modal-meta"></div>

</div>

<div id="modalBody" class="modal-body"></div>

<button
class="modal-close"
onclick="closeMessage()">
Close
</button>

</div>

</div>


<script>

const DOMAIN="catch.devitads.my.id";

let messages=[];
let currentTab="inbox";

let readMessages=
JSON.parse(
localStorage.getItem("temporary_read")||"[]"
);


/* CREATE RANDOM EMAIL */

function randomEmail(){

return "user"+
Math.random()
.toString(36)
.substring(2,10)+
"@"+
DOMAIN;

}


/* GET CURRENT EMAIL */

function getEmail(){

return localStorage.getItem("temporary_email");

}


/* CREATE NEW EMAIL */

function newEmail(){

const address=randomEmail();

localStorage.setItem(
"temporary_email",
address
);

document.getElementById("email").value=
address;

messages=[];

renderMessages();

loadInbox();

}


/* COPY EMAIL */

async function copyEmail(){

const address=
document.getElementById("email").value;

try{

await navigator.clipboard.writeText(address);

document.getElementById("status")
.textContent="Email copied.";

}catch(e){

document.getElementById("status")
.textContent=address;

}

}


/* ESCAPE TEXT */

function escapeHTML(text){

return String(text??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* CHANGE TAB */

function changeTab(tab,element){

currentTab=tab;

document
.querySelectorAll(".tab")
.forEach(function(x){

x.classList.remove("active");

});

element.classList.add("active");

document.getElementById("sectionTitle")
.textContent=
tab==="inbox"
?"Inbox"
:
tab==="new"
?"New"
:"Spam";

renderMessages();

}


/* SHOW MESSAGES */

function renderMessages(){

const box=
document.getElementById("inbox");

if(currentTab==="spam"){

box.innerHTML=
'<div class="empty">No spam emails.</div>';

document.getElementById("count")
.textContent="0";

return;

}

let list=messages;

if(currentTab==="new"){

list=messages.filter(function(m){

return !readMessages.includes(
String(m.id)
);

});

}

document.getElementById("count")
.textContent=list.length;

if(list.length===0){

box.innerHTML=
'<div class="empty">No emails yet.</div>';

return;

}

box.innerHTML=
list.map(function(m){

const subject=
m.subject||"(No subject)";

const sender=
m.from||"Unknown sender";

return `

<div class="message"
onclick="openMessage('${String(m.id).replace(/'/g,"")}')">

<div class="subject">
${escapeHTML(subject)}
</div>

<div class="meta">
${escapeHTML(sender)}
${m.date?" · "+escapeHTML(m.date):""}
</div>

<div class="preview">
Click to open email
</div>

</div>

`;

}).join("");

}


/* OPEN EMAIL + LOAD FULL CONTENT */

async function openMessage(id){

const m=
messages.find(function(x){

return String(x.id)===String(id);

});

if(!m)return;

const address=getEmail();

if(!address)return;


/* MARK AS READ */

if(!readMessages.includes(String(m.id))){

readMessages.push(String(m.id));

localStorage.setItem(
"temporary_read",
JSON.stringify(readMessages)
);

}


/* MODAL HEADER */

document.getElementById("modalSubject")
.textContent=
m.subject||"(No subject)";

document.getElementById("modalMeta")
.textContent=
(m.from||"Unknown sender")+
(m.date?" · "+m.date:"");


/* SHOW MODAL */

const modal=
document.getElementById("modal");

modal.style.display="flex";


/* LOADING */

const bodyBox=
document.getElementById("modalBody");

bodyBox.innerHTML=
'<div class="empty">Loading email...</div>';


try{

/*
Catchmail list API hanya memberikan
data ringkas.

Untuk isi email digunakan:
GET /api/v1/message/{id}?mailbox=...
*/

const detailApi=
"https://api.catchmail.io/api/v1/message/"+
encodeURIComponent(m.id)+
"?mailbox="+
encodeURIComponent(address);


/*
Gunakan proxy supaya halaman GitHub Pages
bisa mengambil data dari API.
*/

const proxy=
"https://api.allorigins.win/raw?url="+
encodeURIComponent(
detailApi+"&t="+Date.now()
);


const response=
await fetch(proxy);


if(!response.ok){

throw new Error("Failed");

}


const detail=
await response.json();


const html=
detail.body &&
detail.body.html;

const text=
detail.body &&
detail.body.text;


/*
Kalau email punya HTML,
tampilkan dalam iframe sandbox.

Script email tidak diizinkan berjalan.
Link biasa diarahkan ke tab baru.
*/

if(html){

bodyBox.innerHTML="";


const iframe=
document.createElement("iframe");

iframe.className="email-frame";

iframe.setAttribute(
"sandbox",
"allow-popups allow-popups-to-escape-sandbox"
);


iframe.srcdoc=
"<!doctype html>"+
"<html>"+
"<head>"+
"<meta name='viewport' content='width=device-width,initial-scale=1'>"+
"<base target='_blank'>"+
"<style>"+
"body{font-family:Arial,sans-serif;color:#333;padding:16px;word-break:break-word;line-height:1.5}"+
"img{max-width:100%;height:auto}"+
"a{word-break:break-word}"+
"table{max-width:100%;width:auto}"+
"</style>"+
"</head>"+
"<body>"+
html+
"</body>"+
"</html>";


bodyBox.appendChild(iframe);


/*
Kalau hanya text,
tampilkan text biasa.
*/

}else{

bodyBox.innerHTML="";

const textDiv=
document.createElement("div");

textDiv.className="text-body";

textDiv.textContent=
text||"No text content.";

bodyBox.appendChild(textDiv);

}

}catch(error){

bodyBox.innerHTML=
'<div class="empty">'+
'Email ditemukan, tetapi isi email gagal dibuka. Coba lagi.'+
'</div>';

}


renderMessages();

}


/* CLOSE EMAIL */

function closeMessage(){

document.getElementById("modal")
.style.display="none";

}


/* LOAD INBOX */

async function loadInbox(){

const address=getEmail();

if(!address)return;


document.getElementById("status")
.textContent="Checking inbox...";


try{

const api=
"https://api.catchmail.io/api/v1/mailbox?address="+
encodeURIComponent(address);


/*
CORS proxy
*/

const proxy=
"https://api.allorigins.win/raw?url="+
encodeURIComponent(
api+"&t="+Date.now()
);


const response=
await fetch(proxy);


if(!response.ok){

throw new Error();

}


const data=
await response.json();


messages=
Array.isArray(data.messages)
?data.messages
:[];


document.getElementById("status")
.textContent=
messages.length+
(
messages.length===1
?" email received."
:" emails received."
);


renderMessages();


}catch(error){

document.getElementById("status")
.textContent=
"Unable to load inbox. Try Refresh.";

}

}


/* START */

function start(){

const address=getEmail();

if(!address){

newEmail();

}else{

document.getElementById("email")
.value=address;

loadInbox();

}

}


start();


/* AUTO REFRESH EVERY 10 SECONDS */

setInterval(
loadInbox,
10000
);


/* CLOSE MODAL WHEN CLICK OUTSIDE */

document.getElementById("modal")
.addEventListener(
"click",
function(e){

if(e.target===this){

closeMessage();

}

}
);

</script>

</body>
</html>
